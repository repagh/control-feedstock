{% set python_min = '3.10' %}
{% set name = "control" %}
{% set version = "0.10.1b" %}
{% set sha256 = "d0386fe551d6af78aeb5fde90bc0decb381d8977292eba4a810d1232507d578b" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://github.com/repagh/python-control/archive/refs/tags/{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - matplotlib-base
    - slycot

test:
  requires:
    - python {{ python_min }}
  imports:
    - control

about:
  home: https://python-control.org
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/repagh/python-control
  doc_url: https://python-control.readthedocs.org/
  summary: 'Python Control Systems Library'

extra:
  recipe-maintainers:
    - moorepants
    - murrayrm
    - bnavigator
